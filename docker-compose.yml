services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-./.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend-rdf
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-./.env}
    volumes:
      - ./backend-rdf/data:/app/data
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./sitrep-app
      args:
        VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
