services:
  caddy:
    # Caddy terminates public HTTP/HTTPS and routes each configured domain to the
    # correct internal service.
    image: caddy:2.9-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-./.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/agraph-ca.crt:/etc/caddy/certs/agraph-ca.crt:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      keycloak:
        condition: service_started

  keycloak-postgres:
    # Private PostgreSQL database for Keycloak identity data.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    # Keycloak is only reachable through Caddy; no host port is published.
    image: quay.io/keycloak/keycloak:26.7.2
    restart: unless-stopped
    command:
      - start
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --hostname=https://${KEYCLOAK_DOMAIN}
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
    expose:
      - "8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy

  allegrograph:
    # AllegroGraph stores RDF data; only localhost gets a direct host port.
    image: franzinc/agraph:v9.1.0.t2
    restart: unless-stopped
    environment:
      AGRAPH_SUPER_USER: ${ALLEGRO_USERNAME}
      AGRAPH_SUPER_PASSWORD: ${ALLEGRO_PASSWORD}
    shm_size: 2g
    volumes:
      - ./allegrograph/agraph.cfg:/agraph/etc/agraph.cfg:rw
      - ./certs/agraph-server.pem:/agraph/certs/server-cert-and-key.pem:ro
      - allegrograph_data:/agraph/data
    expose:
      - "10036"
    ports:
      - "127.0.0.1:10036:10036"

  backend:
    # Backend exposes GraphQL, auth cookies, organisation metadata, and SPARQL
    # access to the active repository.
    build:
      context: ./backend-rdf
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-./.env}
    environment:
      NODE_EXTRA_CA_CERTS: /app/certs/agraph-ca.crt
    volumes:
      - ./backend-rdf/data:/app/data
      - ./certs/agraph-ca.crt:/app/certs/agraph-ca.crt:ro
    expose:
      - "4000"
    depends_on:
      allegrograph:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    # Frontend is built with the public GraphQL URL baked into Vite output and
    # served by nginx inside the container.
    build:
      context: ./sitrep-app
      args:
        VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # Named volumes keep service state across container recreations.
  allegrograph_data:
  keycloak_postgres_data:
  caddy_data:
  caddy_config:
