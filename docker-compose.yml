services:
  caddy:
    # Caddy terminates public HTTP/HTTPS and routes each configured domain to the
    # correct internal service.
    image: caddy:2.9-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-./.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  allegrograph:
    # AllegroGraph stores RDF data; only localhost gets a direct host port.
    image: franzinc/agraph:v9.1.0.t2
    restart: unless-stopped
    environment:
      AGRAPH_SUPER_USER: ${ALLEGRO_USERNAME}
      AGRAPH_SUPER_PASSWORD: ${ALLEGRO_PASSWORD}
    shm_size: 2g
    volumes:
      - allegrograph_data:/agraph/data
    expose:
      - "10035"
    ports:
      - "127.0.0.1:10035:10035"

  backend:
    # Backend exposes GraphQL, auth cookies, organisation metadata, and SPARQL
    # access to the active repository.
    build:
      context: ./backend-rdf
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-./.env}
    volumes:
      - ./backend-rdf/data:/app/data
    expose:
      - "4000"
    depends_on:
      allegrograph:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    # Frontend is built with the public GraphQL URL baked into Vite output and
    # served by nginx inside the container.
    build:
      context: ./sitrep-app
      args:
        VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # Named volumes keep service state across container recreations.
  allegrograph_data:
  caddy_data:
  caddy_config:
