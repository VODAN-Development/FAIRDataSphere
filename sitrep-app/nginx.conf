server {
    listen 80;
    server_name _;

    # Serve the compiled Vite app from nginx's default static root.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # React Router owns client-side routes, so unknown paths fall back to the
        # app shell instead of returning 404.
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        # Fingerprinted assets can be cached aggressively by browsers/CDNs.
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
